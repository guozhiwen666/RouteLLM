# 路由配置（字段与设计文档 README 的 routing.yaml 示例一一对应）
#
# 覆盖顺序：环境变量 > 本文件 > 代码默认值
# 价格单位统一为 CNY / 百万 token；本地档位填 GPU 折旧（元/小时）。
# 注意：这里的 frontier 价格是占位值，上线前必须按真实供应商报价替换，
# 否则成本报表感动自己、误导决策。

routing:
  tiers:
    # 本地池：按 max_context 从小到大，路由优先挑能装下的最小档位
    - name: slm_tiny
      model: qwen3-0.6b-awq
      endpoint: http://localhost:8000
      local: true                # 显式声明，别靠 endpoint 长什么样去猜
      max_context: 8192
      gpu_hourly_cost_cny: 3.0
    - name: slm_mid
      model: qwen3-8b-awq
      endpoint: http://localhost:8001
      local: true
      max_context: 32768
      gpu_hourly_cost_cny: 6.0
    - name: frontier
      model: claude-frontier-2026-08-01
      endpoint: upstream
      local: false               # 不写则按 endpoint=upstream 推断，但显式更稳
      max_context: 200000
      price_input_per_mtok: 70.0
      price_output_per_mtok: 350.0
      # 缓存命中的 input 单价（README 要求 cached_input_tokens 单独统计与计价）
      price_cached_input_per_mtok: 7.0

  classifier:
    mode: tiny_model_self_eval     # heuristic | tiny_model_self_eval | trained
    confidence_threshold: 0.75    # 自评置信度低于此值 → 保守升级到强模型

  force_upgrade_rules:            # 命中即强制用 frontier，不看自评结果
    - contains_math_or_code
    - context_tokens > 24000
    - requires_realtime_data
    - output_format == strict_json

  cache:
    semantic_threshold: 0.95      # 低于此值形似神不似，宁可不命中
    entity_consistency_check: true
    exclude_pii: true
    ttl_hours: 72
    invalidate_on: [model_version, prompt_version]

  guardian:
    shadow_ratio: 0.05            # 5% 影子流量双跑
    max_quality_drop: 0.02        # 2pp
    consecutive_windows: 3        # 连续 3 个窗口超阈值才降级
    auto_rollback: true
